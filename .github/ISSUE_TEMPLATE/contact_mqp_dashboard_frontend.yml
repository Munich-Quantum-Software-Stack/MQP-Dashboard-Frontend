name: Contact the MQP Frontend Dashboard Team of the MQSS
description: File a request to the "Munich Quantum Software Stack (MQSS)" team
title: '[Contact F4-E: MQP Frontend Dashboard team]: '
labels: ['Contact_F4-E']
projects: ['F4-E: MQP Frontend Dashboard team']
assignees:
  - parth2911lrz
body:
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@yourcompany.de
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: Tell us about your request
      placeholder: Tell us as much as you can!
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you for visiting, come back soon 🙂
