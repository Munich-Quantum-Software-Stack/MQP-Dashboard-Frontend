name: Publish Documentation

on:
  push:
    branches:
      - develop
    paths:
      - README.md
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare docs source from README
        run: |
          mkdir -p .docs-pages
          cp README.md .docs-pages/index.md
          cat > .docs-pages/_config.yml <<'EOF'
          title: MQP Dashboard Frontend Documentation
          description: Documentation generated from README.md
          markdown: kramdown
          kramdown:
            input: GFM
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.docs-pages
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
